
name: LPG-Daten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  update-lpg:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Osmium installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Deutschland-Daten herunterladen
        run: |
          curl -fL --retry 3 \
            -o germany.osm.pbf \
            https://download.geofabrik.de/europe/germany-latest.osm.pbf

      - name: LPG-Tankstellen herausfiltern
        run: |
          osmium tags-filter germany.osm.pbf \
            nwr/fuel:lpg=yes \
            -o lpg.osm.pbf

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export-Skript ausführen
        run: |
          python -m pip install osmium
          python scripts/export_lpg.py
      - name: OSM-Datenstand speichern
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/lpg_deutschland.geojson")
          data = json.loads(path.read_text(encoding="utf-8"))

          data["generated_at"] = datetime.now(timezone.utc).isoformat()
          path.write_text(
              json.dumps(data, ensure_ascii=False),
              encoding="utf-8"
          )
          PY
      - name: Daten veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lpg_deutschland.geojson
          git diff --cached --quiet || git commit -m "LPG-Daten aktualisiert"
          git push
